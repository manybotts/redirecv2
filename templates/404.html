<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Not Found</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background: #f7f9fc;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      animation: fadeIn 1s ease-in-out;
    }
    .container {
      text-align: center;
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 3rem;
      color: #b71c1c;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 1.5rem;
    }
    a {
      text-decoration: none;
      color: #007BFF;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    a:hover {
      color: #0056b3;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Oops! The requested page was not found.</p>
    <a href="/">Return to Home</a>
  </div>
</body>
</html>
