<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    function redirect() {
      var now = Date.now();
      // Attempt to open the Telegram app via the tg:// URL
      window.location = "{{ tg_url }}";
      // Fallback: if not redirected within 1 second, open the web URL
      setTimeout(function() {
        if (Date.now() - now < 2000) {
          window.location = "{{ web_url }}";
        }
      }, 1000);
    }
    window.onload = redirect;
  </script>
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      text-align: center;
      padding-top: 50px;
      background: #f7f9fc;
      margin: 0;
      color: #333;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
    }
    a {
      color: #007BFF;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    a:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Redirecting...</h1>
  <p>If you are not redirected automatically, <a href="{{ web_url }}">click here</a>.</p>
</body>
</html>
