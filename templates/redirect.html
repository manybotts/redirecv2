<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background: #f7f9fc;
      margin: 0;
      padding: 0;
      text-align: center;
      animation: fadeIn 0.5s ease-in-out;
    }
    .container {
      margin: 100px auto;
      max-width: 600px;
      background: #fff;
      padding: 3rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 1.5rem;
      font-size: 2.5rem;
    }
    p {
      font-size: 1.5rem;
      color: #666;
    }
    a {
      color: #007BFF;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    a:hover {
      color: #0056b3;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <script type="text/javascript">
    // Immediately redirect on page load.
    window.onload = function() {
      window.location.replace("{{ telegram_url }}");
    };
  </script>
  <noscript>
    <meta http-equiv="refresh" content="1;url={{ telegram_url }}">
  </noscript>
</head>
<body>
  <div class="container">
    <h1>Redirecting...</h1>
    <p>Redirecting to Telegram bot: <strong>{{ bot_username }}</strong></p>
    <p>If you are not redirected automatically, <a href="{{ telegram_url }}">click here</a>.</p>
  </div>
</body>
</html>
